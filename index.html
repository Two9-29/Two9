<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mara Voss — Links</title>
<style>
  :root{
    --mono: 'SF Mono', 'Space Mono', 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', Manrope, Arial, sans-serif;
  }
  :root{
    --bg: #15130E;
    --bg-panel: #1D1912;
    --fg: #F2ECDD;
    --dim: #948C77;
    --accent: #FF6A39;
    --accent-dim: #6B2E1B;
    --brass: #D4A24C;
    --teal: #3E6259;
    --led-off: #3A3428;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
  }
  .bg-noise{
    position:fixed; inset:0; pointer-events:none; opacity:.05;
    background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
    background-size: 3px 3px;
  }
  .page{
    width:100%;
    max-width: 420px;
    position:relative;
    z-index:1;
  }
  .eyebrow{
    font-family: var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    color: var(--dim);
    text-align:center;
    text-transform:uppercase;
    margin-bottom: 18px;
  }
  .scope{
    width: 128px;
    height: 128px;
    margin: 0 auto 22px;
    border-radius:50%;
    background: radial-gradient(circle at 50% 42%, #241F16 0%, #17140E 78%);
    border: 1px solid #3A3325;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 22px rgba(0,0,0,.6);
  }
  .scope::before{
    content:'';
    position:absolute; inset:10px;
    border-radius:50%;
    border: 1px solid rgba(255,106,57,.12);
  }
  .scope canvas{
    width: 92px; height: 46px;
    filter: drop-shadow(0 0 4px rgba(255,106,57,.55));
  }
  h1{
    font-family: var(--mono);
    font-weight:700;
    font-size: 22px;
    letter-spacing:.04em;
    text-align:center;
    margin: 0 0 6px;
    text-transform:uppercase;
  }
  .tagline{
    text-align:center;
    color: var(--dim);
    font-size: 14px;
    line-height:1.5;
    margin: 0 0 34px;
    padding: 0 24px;
  }
  .jacks{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .jack{
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--bg-panel);
    border: 1px solid #322C20;
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration:none;
    color: var(--fg);
    transition: border-color .18s ease, transform .12s ease, background .18s ease;
    position:relative;
    overflow:hidden;
  }
  .jack:hover, .jack:focus-visible{
    border-color: var(--accent);
    background: #221B13;
    transform: translateY(-1px);
    outline: none;
  }
  .jack:focus-visible{
    box-shadow: 0 0 0 2px var(--accent-dim);
  }
  .leds{
    display:flex;
    flex-direction:column;
    gap:5px;
    flex-shrink:0;
  }
  .led{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--led-off);
    transition: background .25s ease, box-shadow .25s ease;
  }
  .jack:hover .led{
    background: var(--accent);
    box-shadow: 0 0 6px rgba(255,106,57,.8);
  }
  .jack:hover .led:nth-child(2){ transition-delay: .06s; }
  .jack-icon{
    width: 18px;
    height: 18px;
    flex-shrink:0;
    color: var(--fg);
  }
  .jack-label{
    font-size: 15px;
    font-weight: 600;
    flex:1;
  }
  @media (prefers-reduced-motion: reduce){
    .jack{ transition:none; }
    .led{ transition:none; }
  }
</style>
</head>
<body>
<div class="bg-noise"></div>
<div class="page">

  <div class="scope"><canvas id="waveform" width="184" height="92"></canvas></div>

  <h1>Two9</h1>
  <p class="tagline">Trusting someone means relying on them and only weak do that</p>

  <nav class="jacks" aria-label="Links">
    <a class="jack" href=https://x.com/Two9ngle target="_blank" rel="noopener">
      <span class="leds"><span class="led"></span><span class="led"></span></span>
      <svg class="jack-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.3 3h3.2l-7 8 8.2 10h-6.4l-5-6.5L4.7 21H1.5l7.5-8.6L1 3h6.5l4.5 6z"/></svg>
      <span class="jack-label">X</span>
    </a>
    <div> class="jack" href="#"target="_blank" rel="noopener">
      <span class="leds"><span class="led"></span><span class="led"></span></span>
      <svg class="jack-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="7" width="16" height="11" rx="5"/><circle cx="9" cy="12.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="12.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span class="jack-label">Two9</span>
    </a>
  </nav>
</div>

<script>
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 0;

  function draw(){
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.beginPath();
    ctx.strokeStyle = '#FF6A39';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    for(let x=0; x<=w; x+=2){
      const p = x / w;
      const y = h/2
        + Math.sin(p*14 + t) * 14
        + Math.sin(p*3.2 + t*0.6) * 10
        + Math.sin(p*23 + t*1.4) * 3;
      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
    if(!reduceMotion){
      t += 0.035;
      requestAnimationFrame(draw);
    }
  }
  draw();
</script>
</body>
</html>
