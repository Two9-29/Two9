<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two9</title>
<style>
  :root{
    --mono: 'SF Mono', 'Space Mono', 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', Manrope, Arial, sans-serif;
  }
  :root{
    --bg: #15130E;
    --bg-panel: #1D1912;
    --fg: #F2ECDD;
    --dim: #948C77;
    --accent: #FF6A39;
    --accent-dim: #6B2E1B;
    --brass: #D4A24C;
    --teal: #3E6259;
    --led-off: #3A3428;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
  }
  .bg-noise{
    position:fixed; inset:0; pointer-events:none; opacity:.05;
    background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
    background-size: 3px 3px;
  }
  .page{
    width:100%;
    max-width: 420px;
    position:relative;
    z-index:1;
  }
  .eyebrow{
    font-family: var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    color: var(--dim);
    text-align:center;
    text-transform:uppercase;
    margin-bottom: 18px;
  }
  .scope{
    width: 128px;
    height: 128px;
    margin: 0 auto 22px;
    border-radius:50%;
    background: radial-gradient(circle at 50% 42%, #241F16 0%, #17140E 78%);
    border: 1px solid #3A3325;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 22px rgba(0,0,0,.6);
  }
  .scope::before{
    content:'';
    position:absolute; inset:10px;
    border-radius:50%;
    border: 1px solid rgba(255,106,57,.12);
  }
  .scope canvas{
    width: 92px; height: 46px;
    filter: drop-shadow(0 0 4px rgba(255,106,57,.55));
  }
  .profile-pic{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
  h1{
    font-family: var(--mono);
    font-weight:700;
    font-size: 22px;
    letter-spacing:.04em;
    text-align:center;
    margin: 0 0 6px;
    text-transform:uppercase;
  }
  .tagline{
    text-align:center;
    color: var(--dim);
    font-size: 14px;
    line-height:1.5;
    margin: 0 0 34px;
    padding: 0 24px;
  }
  .jacks{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .jack{
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--bg-panel);
    border: 1px solid #322C20;
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration:none;
    color: var(--fg);
    transition: border-color .18s ease, transform .12s ease, background .18s ease;
    position:relative;
    overflow:hidden;
  }
  .jack:hover, .jack:focus-visible{
    border-color: var(--accent);
    background: #221B13;
    transform: translateY(-1px);
    outline: none;
  }
  .jack:focus-visible{
    box-shadow: 0 0 0 2px var(--accent-dim);
  }
  .leds{
    display:flex;
    flex-direction:column;
    gap:5px;
    flex-shrink:0;
  }
  .led{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--led-off);
    transition: background .25s ease, box-shadow .25s ease;
  }
  .jack:hover .led{
    background: var(--accent);
    box-shadow: 0 0 6px rgba(255,106,57,.8);
  }
  .jack:hover .led:nth-child(2){ transition-delay: .06s; }
  .jack-icon{
    width: 18px;
    height: 18px;
    flex-shrink:0;
    color: var(--fg);
  }
  .jack-label{
    font-size: 15px;
    font-weight: 600;
    flex:1;
  }
  @media (prefers-reduced-motion: reduce){
    .jack{ transition:none; }
    .led{ transition:none; }
  }
  #intro{
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity .7s ease;
  }
  #intro.fade-out{ opacity: 0; pointer-events: none; }
  #intro-video, #intro-gif{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .intro-text{
    position: relative;
    z-index: 1;
    font-family: var(--mono);
    font-size: 28px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--fg);
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }
  #sound-toggle{
    position: absolute;
    z-index: 2;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(21,19,14,.7);
    border: 1px solid var(--brass);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #sound-toggle svg{ width: 20px; height: 20px; }
  @media (prefers-reduced-motion: reduce){
    #intro{ display: none; }
  }
</style>
</head>
<body>
<div id="intro">
  <video id="intro-video" src="intro.mp4" autoplay muted playsinline></video>
  <img id="intro-gif" src="intro.gif" alt="" style="display:none;">
  <div class="intro-text">Welcome</div>
  <button id="sound-toggle" aria-label="Turn sound on" type="button">
    <svg id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="16" y1="8" x2="21" y2="16"/><line x1="21" y1="8" x2="16" y2="16"/></svg>
  </button>
</div>

<div class="bg-noise"></div>
<div class="page" id="main-site">

  <div class="scope"><img src="profile.jpg" alt="Two9" class="profile-pic"></div>

  <h1>Two9</h1>
  <p class="tagline">Trusting someone means relying on them and only weak do that</p>

  <nav class="jacks" aria-label="Links">
    <a class="jack" href="https://x.com/Two9ngle" target="_blank" rel="noopener">
      <span class="leds"><span class="led"></span><span class="led"></span></span>
      <svg class="jack-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.3 3h3.2l-7 8 8.2 10h-6.4l-5-6.5L4.7 21H1.5l7.5-8.6L1 3h6.5l4.5 6z"/></svg>
      <span class="jack-label">Two9</span>
    </a>
    <div class="jack">
      <span class="leds"><span class="led"></span><span class="led"></span></span>
      <svg class="jack-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="7" width="16" height="11" rx="5"/><circle cx="9" cy="12.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="12.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span class="jack-label">Two9</span>
    </div>
  </nav>
</div>

<script>
  const intro = document.getElementById('intro');
  const video = document.getElementById('intro-video');
  const gif = document.getElementById('intro-gif');
  const soundToggle = document.getElementById('sound-toggle');
  const soundIcon = document.getElementById('sound-icon');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const iconOn = '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
  const iconOff = '<path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="16" y1="8" x2="21" y2="16"/><line x1="21" y1="8" x2="16" y2="16"/>';

  soundToggle.addEventListener('click', () => {
    video.muted = !video.muted;
    soundIcon.innerHTML = video.muted ? iconOff : iconOn;
    soundToggle.setAttribute('aria-label', video.muted ? 'Turn sound on' : 'Turn sound off');
  });

  function endIntro(){
    intro.classList.add('fade-out');
    setTimeout(() => { intro.style.display = 'none'; }, 700);
  }

  if(reduceMotion){
    intro.style.display = 'none';
  } else {
    video.addEventListener('ended', endIntro);
    video.addEventListener('error', () => {
      video.style.display = 'none';
      gif.style.display = 'block';
      soundToggle.style.display = 'none';
    });
    setTimeout(endIntro, 15500);
  }
</script>
</body>
</html>
